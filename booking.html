<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TravelBooking</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">

            <a class="navbar-brand fw-bold" href="#">
                TravelBooking
            </a>

            <div>
                <a href="#" class="btn btn-outline-light me-2">
                    Home
                </a>

                <a href="#" class="btn btn-light">
                    Sign In
                </a>
            </div>

        </div>
    </nav>


    <!-- Booking Section -->
    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8 col-md-10">

                <!-- Booking Card -->
                <div class="card shadow border-0">

                    <div class="card-header bg-primary text-white text-center py-3">

                        <h3 class="mb-1">
                            Travel Booking
                        </h3>

                        <p class="mb-0">
                            Book your journey easily
                        </p>

                    </div>


                    <div class="card-body p-4">

                        <form>

                            <div class="row g-3">

                                <!-- From -->
                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        From
                                    </label>

                                    <select class="form-select">

                                        <option selected>
                                            Select Departure City
                                        </option>

                                        <option>Delhi</option>
                                        <option>Mumbai</option>
                                        <option>Bangalore</option>
                                        <option>Kolkata</option>
                                        <option>Patna</option>
                                        <option>Bhopal</option>

                                    </select>

                                </div>


                                <!-- To -->
                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        To
                                    </label>

                                    <select class="form-select">

                                        <option selected>
                                            Select Destination City
                                        </option>

                                        <option>Delhi</option>
                                        <option>Mumbai</option>
                                        <option>Bangalore</option>
                                        <option>Kolkata</option>
                                        <option>Patna</option>
                                        <option>Bhopal</option>

                                    </select>

                                </div>


                                <!-- Journey Date -->
                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        Journey Date
                                    </label>

                                    <input type="date" class="form-control">

                                </div>


                                <!-- Return Date -->
                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        Return Date
                                    </label>

                                    <input type="date" class="form-control">

                                </div>


                                <!-- Passengers -->
                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        Number of Passengers
                                    </label>

                                    <select class="form-select">

                                        <option selected>
                                            Select Passengers
                                        </option>

                                        <option>1 Passenger</option>
                                        <option>2 Passengers</option>
                                        <option>3 Passengers</option>
                                        <option>4 Passengers</option>
                                        <option>5 Passengers</option>
                                        <option>6 Passengers</option>

                                    </select>

                                </div>


                                <!-- Travel Type -->
                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        Travel Type
                                    </label>

                                    <select class="form-select">

                                        <option selected>
                                            Select Travel Type
                                        </option>

                                        <option>Bus</option>
                                        <option>Train</option>
                                        <option>Flight</option>
                                        <option>Cab</option>

                                    </select>

                                </div>


                                <!-- Boarding Point -->
                                <div class="col-12">

                                    <label class="form-label fw-semibold">
                                        Boarding Point
                                    </label>

                                    <select class="form-select">

                                        <option selected>
                                            Select Boarding Point
                                        </option>

                                        <option>Bus Stand</option>
                                        <option>Railway Station</option>
                                        <option>Airport</option>
                                        <option>City Center</option>

                                    </select>

                                </div>


                                <!-- Passenger Name -->
                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        Passenger Name
                                    </label>

                                    <input type="text" class="form-control" placeholder="Enter passenger name">

                                </div>


                                <!-- Mobile -->
                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        Mobile Number
                                    </label>

                                    <input type="tel" class="form-control" placeholder="Enter mobile number">

                                </div>


                                <!-- Email -->
                                <div class="col-12">

                                    <label class="form-label fw-semibold">
                                        Email Address
                                    </label>

                                    <input type="email" class="form-control" placeholder="Enter email address">

                                </div>


                                <!-- Terms -->
                                <div class="col-12">

                                    <div class="form-check">

                                        <input class="form-check-input" type="checkbox" id="terms">

                                        <label class="form-check-label" for="terms">
                                            I agree to the terms and conditions.
                                        </label>

                                    </div>

                                </div>


                                <!-- Button -->
                                <div class="col-12 text-center mt-4">

                                    <button type="submit" class="btn btn-primary btn-lg px-5">
                                        Search Travel
                                    </button>

                                </div>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">

        <p class="mb-0">
            © 2026 TravelBooking. All Rights Reserved.
        </p>

    </footer>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
```
